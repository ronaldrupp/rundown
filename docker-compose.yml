# Everything for a server: the app, plus Caddy for HTTPS. Set DOMAIN in .env (see .env.example).
services:
  rundown:
    build: .
    image: rundown
    volumes:
      # accounts, sessions and rundowns (SQLite)
      - data:/data
      # downloaded videos, also where you drop your own reference files
      - ./media:/app/media
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates; keep them, or Let's Encrypt rate limits hit on rebuilds
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      rundown:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
