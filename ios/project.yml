name: CamOp
options:
  bundleIdPrefix: com.rundown
  deploymentTarget:
    iOS: "26.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  CamOp:
    type: application
    platform: iOS
    sources: [CamOp]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rundown.camop
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to the director's rundown server on your network.
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
    info:
      path: CamOp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
