<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundown MTC</title>
<!-- served by server/mtc.js: the generator's transport on top, and below it a playback machine that plays a track
     chased to the generator's MTC -->
<style>
  :root { --bg: #0a0a0a; --bg2: #171717; --fill: #262626; --fill-hi: #2f2f2f; --text: #fafafa; --dim: #a1a1a1; --line: rgba(255,255,255,.1);
    --red: #e5484d; --green: #46a758; --orange: #f76b15; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; color-scheme: dark }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif }
  main { width: min(560px, 100% - 32px); display: grid; gap: 10px; margin: 12px 0 }
  section { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px }
  header { display: flex; justify-content: space-between; align-items: center; color: var(--dim) }
  .badge { font: 600 11px var(--mono); letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: var(--fill) }
  .badge.on { background: var(--red); color: #fff } .badge.wait { background: var(--orange); color: #fff }
  .big { font: 500 clamp(28px, 9vw, 40px) var(--mono); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1 }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between }
  .tc { font-family: var(--mono); font-variant-numeric: tabular-nums }
  button, input { font: inherit; color: var(--text); background: var(--fill); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 36px; min-width: 0 }
  button { flex: 1; cursor: pointer } button:hover { background: var(--fill-hi) }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--dim); outline-offset: 1px }
  #play { flex: 2; font-weight: 600 }
  #at { flex: 2; font-family: var(--mono) } #start { font-family: var(--mono); width: 130px } #file { flex: 1 }
  input[aria-invalid=true] { border-color: var(--red) }
  label { display: flex; gap: 8px; align-items: center; justify-content: space-between; color: var(--dim) }
  video { width: 100%; aspect-ratio: 16 / 9; max-height: 28vh; object-fit: contain; background: #000; border-radius: 6px }
  .hint { color: var(--dim); font-size: 12px; margin: 0 }
</style>
<main>
  <section aria-label="Timecode generator">
    <header><span>Timecode · Rundown MTC · 25 fps</span><span class="badge" id="gstate">PAUSED</span></header>
    <div class="big" id="gtc" aria-live="off">--:--:--:--</div>
    <div class="row">
      <button data-cmd="start" title="Back to the start time (0)">Start</button>
      <button data-cmd="jump" data-s="-5" title="Back 5 seconds (←)">−5 s</button>
      <button id="play" data-cmd="toggle" title="Play or pause (Space)">Play</button>
      <button data-cmd="jump" data-s="5" title="Forward 5 seconds (→)">+5 s</button>
    </div>
    <form class="row" id="go">
      <input id="at" aria-label="Locate to timecode" placeholder="hh:mm:ss:ff" autocomplete="off">
      <button>Locate</button>
    </form>
    <p class="hint">Space plays and pauses, ← → jump 5 s, 0 goes back to the start time.</p>
  </section>

  <section aria-label="Playback">
    <header><span>Playback</span><span class="badge" id="pstate">NO TRACK</span></header>
    <video id="v" playsinline></video>
    <div class="big" id="pos" aria-live="off">--:--</div>
    <div class="row"><span>Incoming MTC</span><span class="tc" id="tc">--:--:--:--</span></div>
    <div class="row">
      <input type="file" id="file" accept="audio/*,video/*" aria-label="Track">
      <label>Starts at <input id="start" value="00:00:00:00" aria-label="Track starts at timecode" autocomplete="off"></label>
    </div>
    <p class="hint"><span id="midi">Connecting to the generator.</span> The track plays while MTC rolls, stops when it stops, and counts down before its start time.</p>
  </section>
</main>

<script>
  // the generator's transport, through mtc.js's /state and /cmd
  const $ = id => document.getElementById(id)
  let g = { running: false }
  const cmd = body => fetch('/cmd', { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).then(show)
  function show(next) {
    g = next
    $('gtc').textContent = g.tc
    $('gstate').textContent = g.running ? 'RUNNING' : 'PAUSED'
    $('gstate').classList.toggle('on', g.running)
    $('play').textContent = g.running ? 'Pause' : 'Play'
    if (!$('at').value) $('at').placeholder = g.start
  }
  const run = b => b.dataset.cmd === 'toggle' ? cmd({ cmd: g.running ? 'pause' : 'play' })
    : b.dataset.cmd === 'start' ? cmd({ cmd: 'locate', tc: g.start }) : cmd({ cmd: 'jump', s: +b.dataset.s })
  document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => run(b))
  $('go').onsubmit = e => {
    e.preventDefault()
    const ok = /^\d{1,2}:\d{2}:\d{2}:\d{2}$/.test($('at').value)
    $('at').setAttribute('aria-invalid', !ok)
    if (ok) cmd({ cmd: 'locate', tc: $('at').value })
  }
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return
    const b = { ' ': '#play', ArrowLeft: '[data-s="-5"]', ArrowRight: '[data-s="5"]', 0: '[data-cmd=start]' }[e.key]
    if (b) { e.preventDefault(); run(document.querySelector(b)) }
  })
  const poll = () => fetch('/state').then(r => r.json()).then(show).catch(() => $('gstate').textContent = 'STOPPED')
  setInterval(poll, 100); poll()
</script>

<script type="module">
  // the player chases the generator's MTC stream like a playback machine chases house timecode, not its /state
  import { mtcParser, frame, sinceStart } from '/timecode.js'
  const $ = id => document.getElementById(id), v = $('v')
  let ext = null, start = 0 // ext: the last frame, with performance.now() when it came

  const p2 = n => String(Math.floor(n)).padStart(2, '0')
  const clock = s => `${s < 0 ? '−' : ''}${p2(Math.abs(s) / 60)}:${p2(Math.abs(s) % 60)}.${Math.floor(Math.abs(s) * 10) % 10}`

  $('file').onchange = () => { const f = $('file').files[0]; if (f) { URL.revokeObjectURL(v.src); v.src = URL.createObjectURL(f) } }
  try { $('start').value = localStorage.getItem('rundown-mtc-start') || $('start').value } catch {}
  const setStart = () => {
    const m = /^(\d{1,2}):(\d{2}):(\d{2}):(\d{2})$/.exec($('start').value)
    $('start').setAttribute('aria-invalid', !m)
    if (!m) return
    start = +m[1] * 3600 + +m[2] * 60 + +m[3] + +m[4] / 25 // shortcut: start frames read as 25 fps, like the generator
    try { localStorage.setItem('rundown-mtc-start', $('start').value) } catch {}
  }
  $('start').oninput = setStart; setStart()

  const parse = mtcParser(fr => { ext = { ...frame(fr), at: performance.now() } })
  // the generator's MTC as raw MIDI bytes, the same messages its MIDI port sends
  const listen = () => {
    const ws = new WebSocket(`ws://${location.host}/midi`)
    ws.binaryType = 'arraybuffer'
    ws.onopen = () => ($('midi').textContent = 'Listening to the generator.')
    ws.onmessage = e => parse(new Uint8Array(e.data))
    ws.onclose = () => { $('midi').textContent = 'Generator not reachable, retrying.'; setTimeout(listen, 2000) }
  }
  listen()

  // the same rules as Rundown's own chase (store.js): roll while frames come, a gap over 0.25 s means the house stopped
  function tick() {
    const age = ext ? (performance.now() - ext.at) / 1000 : Infinity
    const rolling = ext?.running && age < 0.25
    const t = ext ? sinceStart(ext.t + (rolling ? Math.min(age, 0.25) : 0), start) : null
    const loaded = v.readyState > 0
    const inside = loaded && t !== null && t >= 0 && t < v.duration
    if (rolling && inside) {
      if (v.paused) v.play().catch(() => {}) // blocked until the page was clicked once
      if (Math.abs(v.currentTime - t) > 0.3) v.currentTime = t
    } else {
      if (!v.paused) v.pause()
      if (loaded && t !== null && Math.abs(v.currentTime - Math.max(0, Math.min(t, v.duration))) > 0.3) v.currentTime = Math.max(0, Math.min(t, v.duration))
    }
    $('tc').textContent = ext && age < 2 ? ext.tc : '--:--:--:--'
    $('pos').textContent = !loaded ? '--:--' : t !== null && t < 0 ? clock(t) : clock(v.currentTime)
    const [label, cls] = !loaded ? ['NO TRACK', ''] : !ext || age > 2 ? ['NO TIMECODE', ''] : !rolling ? ['STOPPED', '']
      : t < 0 ? ['WAITING', 'wait'] : inside ? ['PLAYING', 'on'] : ['ENDED', '']
    $('pstate').textContent = label; $('pstate').className = 'badge ' + cls
  }
  setInterval(tick, 20) // a timer, not rAF, so it keeps chasing in a background tab
</script>
